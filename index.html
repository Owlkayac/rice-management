<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>米予約管理</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>🌾 米予約管理</h1>

    <div class="form" id="reservationForm">

      <label for="variety">品種</label>
      <select id="variety">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="E">E</option>
        <option value="F">F</option>
      </select>

      <label for="month">月</label>
      <select id="month">
        <option>10月</option>
        <option>11月</option>
        <option>12月</option>
        <option>1月</option>
        <option>2月</option>
        <option>3月</option>
        <option>4月</option>
        <option>5月</option>
        <option>6月</option>
        <option>7月</option>
        <option>8月</option>
        <option>9月</option>
      </select>

      <label for="name">名前</label>
      <input
        type="text"
        id="name"
        placeholder="例：山田太郎">

      <label for="kg">重量（kg）</label>
      <input
        type="number"
        id="kg"
        min="1"
        step="0.1"
        placeholder="例：5">

      <div class="form-actions">
        <button id="submitButton" type="button" onclick="addReservation()">
          予約を追加
        </button>
        <button id="cancelEditButton" class="cancel-button" type="button" onclick="cancelEdit()" hidden>
          編集をキャンセル
        </button>
      </div>

    </div>

    <h2>予約一覧</h2>

    <div class="filters" aria-label="予約検索・絞り込み">
      <label for="searchName">名前で検索</label>
      <input type="search" id="searchName" placeholder="名前の一部を入力">

      <label for="filterVariety">品種で絞り込み</label>
      <select id="filterVariety">
        <option value="">すべて</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="E">E</option>
        <option value="F">F</option>
      </select>

      <label for="filterMonth">月で絞り込み</label>
      <select id="filterMonth">
        <option value="">すべて</option>
        <option>1月</option>
        <option>2月</option>
        <option>3月</option>
        <option>4月</option>
        <option>5月</option>
        <option>6月</option>
        <option>7月</option>
        <option>8月</option>
        <option>9月</option>
        <option>10月</option>
        <option>11月</option>
        <option>12月</option>
      </select>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>品種</th>
            <th>月</th>
            <th>名前</th>
            <th>kg</th>
            <th>操作</th>
          </tr>
        </thead>

        <tbody id="reservationList"></tbody>

      </table>
    </div>

    <h2>月��合計</h2>

    <div id="summary"></div>

  </div>

  <script src="app.js"></script>

</body>
</html>
