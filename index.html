<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>米予約管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>���� 米予約管理</h1>
    <nav class="view-tabs" aria-label="表示切り替え">
      <button class="view-tab active" type="button" data-view="reservationsView">予約登録・一覧</button>
      <button class="view-tab" type="button" data-view="dashboardView">ダッシュボード</button>
      <button class="view-tab" type="button" data-view="inventoryView">在庫管理</button>
      <button class="view-tab" type="button" data-view="shipmentsView">出荷管理</button>
    </nav>

    <main id="reservationsView" class="view-panel">
      <div class="form" id="reservationForm">
        <label for="variety">品種</label><select id="variety"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select>
        <label for="month">月</label><select id="month"><option>10月</option><option>11月</option><option>12月</option><option>1月</option><option>2月</option><option>3月</option><option>4月</option><option>5月</option><option>6月</option><option>7月</option><option>8月</option><option>9月</option></select>
        <label for="name">名前</label><input type="text" id="name" placeholder="例：山田太郎">
        <label for="kg">重量（kg）</label><input type="number" id="kg" min="1" step="0.1" placeholder="例：5">
        <div class="form-actions"><button id="submitButton" type="button" onclick="addReservation()">予約を追加</button><button id="cancelEditButton" class="cancel-button" type="button" onclick="cancelEdit()" hidden>編集をキャンセル</button></div>
      </div>
      <h2>予約一覧</h2>
      <div class="filters" aria-label="予約検索・絞り込み"><label for="searchName">名前で検索</label><input type="search" id="searchName" placeholder="名前の一部を入力"><label for="filterVariety">品種で絞り込み</label><select id="filterVariety"><option value="">すべて</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select><label for="filterMonth">月で絞り込み</label><select id="filterMonth"><option value="">すべて</option><option>1月</option><option>2月</option><option>3月</option><option>4月</option><option>5月</option><option>6月</option><option>7月</option><option>8月</option><option>9月</option><option>10月</option><option>11月</option><option>12月</option></select></div>
      <div class="table-wrapper"><table><thead><tr><th>品種</th><th>月</th><th>名前</th><th>kg</th><th>操作</th></tr></thead><tbody id="reservationList"></tbody></table></div>
      <h2>月別合計</h2><div id="summary"></div>
    </main>

    <main id="dashboardView" class="view-panel" hidden>
      <div class="dashboard-cards"><section class="total-card"><p>現在の総予約量</p><strong id="dashboardTotal">0kg</strong></section><section class="total-card inventory-card"><p>総在庫量</p><strong id="dashboardInventoryTotal">0kg</strong></section><section class="total-card"><p>総予約量</p><strong id="dashboardReservedTotal">0kg</strong></section><section class="total-card"><p>総出荷量</p><strong id="dashboardShippedTotal">0kg</strong></section><section class="total-card remaining-card"><p>��未出荷予約</p><strong id="dashboardUnshippedTotal">0kg</strong></section><section class="total-card remaining-card"><p>現在の現物在庫</p><strong id="dashboardPhysicalTotal">0kg</strong></section></div>
      <h2>品種別・月別予約量</h2><div class="dashboard-table-wrapper"><table class="dashboard-table"><thead><tr><th>品種＼月</th><th>1月</th><th>2月</th><th>3月</th><th>4月</th><th>5月</th><th>6月</th><th>7月</th><th>8月</th><th>9月</th><th>10月</th><th>11月</th><th>12月</th><th>年間合計</th></tr></thead><tbody id="dashboardBody"></tbody></table></div>
    </main>

    <main id="inventoryView" class="view-panel" hidden><h2>在庫管理</h2><p class="inventory-help">品種ごとの在庫量を入力���てください。残り在庫は出荷済みを差し引いた現物在庫です。</p><div class="inventory-table-wrapper"><table class="inventory-table"><thead><tr><th>品種</th><th>在庫量（kg）</th><th>予約済み</th><th>現物在庫</th><th>状態</th></tr></thead><tbody id="inventoryBody"></tbody></table></div></main>

    <main id="shipmentsView" class="view-panel" hidden>
      <h2>出荷登録</h2>
      <div class="form" id="shipmentForm"><label for="shipmentVariety">品種</label><select id="shipmentVariety"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select><label for="shipmentDate">出荷日</label><input type="date" id="shipmentDate"><label for="shipmentName">顧客名</label><input type="text" id="shipmentName" placeholder="例：山田太郎"><label for="shipmentKg">出荷kg</label><input type="number" id="shipmentKg" min="0.1" step="0.1" placeholder="例：10"><label for="shipmentMemo">メモ</label><input type="text" id="shipmentMemo" placeholder="例：定期注文"><div class="form-actions"><button id="shipmentSubmitButton" type="button" onclick="addShipment()">出荷を登録</button><button id="cancelShipmentEditButton" class="cancel-button" type="button" onclick="cancelShipmentEdit()" hidden>編集をキャンセル</button></div></div>
      <h2>出荷状況</h2><div class="table-wrapper"><table class="shipment-summary-table"><thead><tr><th>品種</th><th>在庫量</th><th>予約済み</th><th>出荷済み</th><th>未出荷予約</th><th>現物在庫</th><th>状態</th></tr></thead><tbody id="shipmentSummaryBody"></tbody></table></div>
      <h2>出荷一覧</h2><div class="table-wrapper"><table><thead><tr><th>出荷日</th><th>品種</th><th>顧客名</th><th>出荷kg</th><th>メモ</th><th>操作</th></tr></thead><tbody id="shipmentList"></tbody></table></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
