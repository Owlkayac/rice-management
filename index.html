<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>米予約管理</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>🌾 米予約管理</h1>

    <div class="form">

      <label>品種</label>
      <select id="variety">
        <option>コシヒカリ</option>
        <option>あきたこまち</option>
        <option>その他</option>
      </select>

      <label>月</label>
      <select id="month">
        <option>10月</option>
        <option>11月</option>
        <option>12月</option>
        <option>1月</option>
        <option>2月</option>
        <option>3月</option>
        <option>4月</option>
        <option>5月</option>
        <option>6月</option>
        <option>7月</option>
        <option>8月</option>
        <option>9月</option>
      </select>

      <label>名前</label>
      <input
        type="text"
        id="name"
        placeholder="例：山田太郎">

      <label>重量（kg）</label>
      <input
        type="number"
        id="kg"
        min="1"
        step="0.1"
        placeholder="例：5">

      <button onclick="addReservation()">
        予約を追加
      </button>

    </div>

    <h2>予約一覧</h2>

    <table>

      <thead>
        <tr>
          <th>品種</th>
          <th>月</th>
          <th>名前</th>
          <th>kg</th>
          <th>削除</th>
        </tr>
      </thead>

      <tbody id="reservationList"></tbody>

    </table>

    <h2>月別合計</h2>

    <div id="summary"></div>

  </div>

  <script src="app.js"></script>

</body>
</html>
